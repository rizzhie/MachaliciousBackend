services:
  - type: web
    name: matchalicious-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Matchalicious
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: ADMIN_NAME
        value: Admin
      - key: ADMIN_EMAIL
        value: admin@gmail.com
      - key: ADMIN_PASSWORD
        value: administrator2026
      - key: CORS_ALLOWED_ORIGINS
        value: "https://dist-xi-pink-29.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "dist-xi-pink-29.vercel.app,localhost:5173,127.0.0.1:5173"
